version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      - MYSQL_HOST: db
      - MYSQL_USER: user
      - MYSQL_PASSWORD: password
      - MYSQL_DATABASE: mydb
    volumes:
      -./index.php:/var/www/html/index.php

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD: root
      - MYSQL_DATABASE: mydb
      - MYSQL_USER: user
      - MYSQL_PASSWORD: password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
